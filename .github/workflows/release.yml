# Creates a GitHub release with shadowrun-edge.zip and module.json, so Foundry can install the module from the
# manifest URL. Runs when:
#   - a tag like v0.3.0 is pushed, or
#   - main / main-tt074g gets a commit whose module.json version has no release yet (the release and its tag are
#     created for that commit).
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main, main-tt074g]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(jq -r .version module.json)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Build the catalog compendium
        if: steps.version.outputs.skip != 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Set version and download URL
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          jq --arg v "${TAG#v}" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/shadowrun-edge.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        if: steps.version.outputs.skip != 'true'
        run: |
          zip -r shadowrun-edge.zip module.json scripts templates styles data lang packs/katalog README.md
          # The Forge rejects packages with more than one file named module.json.
          count=$(unzip -Z1 shadowrun-edge.zip | grep -c '\(^\|/\)module\.json$')
          [ "$count" -eq 1 ] || { echo "Expected one module.json in the zip, found $count"; exit 1; }

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" module.json shadowrun-edge.zip --target "$GITHUB_SHA" \
            --title "Shadowrun Edge $TAG" --generate-notes
