# Pushing a tag like v0.1.0 creates a GitHub release with shadowrun-edge.zip and module.json,
# so Foundry can install the module from the manifest URL.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the catalog compendium
        run: |
          npm ci
          npm test
          npm run build

      - name: Set version and download URL from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/shadowrun-edge.zip" \
             '.version = $v | .download = $d' module.json > module.tmp && mv module.tmp module.json

      - name: Build zip
        run: |
          zip -r shadowrun-edge.zip module.json scripts templates styles data lang packs/katalog README.md
          # The Forge rejects packages with more than one file named module.json.
          count=$(unzip -Z1 shadowrun-edge.zip | grep -c '\(^\|/\)module\.json$')
          [ "$count" -eq 1 ] || { echo "Expected one module.json in the zip, found $count"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" module.json shadowrun-edge.zip \
            --title "Shadowrun Edge $GITHUB_REF_NAME" --generate-notes
